name: build

on:
  push:
    branches:
      - main

env:
  REGISTRY: forgejo.sakurajimalabs.io
  IMAGE: peekaey/pky

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: short sha
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=https://forgejo.sakurajimalabs.io/sakurajimalabs/pky
